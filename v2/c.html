.sl{position:fixed;inset:0}.sl div{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.06);transition:opacity 1.6s ease,transform 7s linear}
.sl div.on{opacity:1;transform:scale(1)}
.sl::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,11,11,.95) 0%,rgba(11,11,11,.2) 50%,rgba(11,11,11,.45) 100%)}
